
name: Build iOS26Spoof

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build package
        run: make clean package THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: iOS26Spoof-DEB
          path: packages/*.deb
